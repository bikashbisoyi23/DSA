name: Move LeetCode Solutions

permissions:
  contents: write

on:
  push:
    branches:
      - main
      - master

jobs:
  move:
    runs-on: ubuntu-latest

    # Avoid running when the workflow itself pushed the commit
    if: github.actor != 'github-actions[bot]'

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Move only LeetCode problem folders
        run: |
          mkdir -p LeetCode

          for item in */ ; do
            folder="${item%/}"

            # Move only folders starting with 4 digits
            # Example: 0001-Two-Sum
            if [[ "$folder" =~ ^[0-9]{4}.* ]]; then
              mv "$folder" LeetCode/ || true
            fi
          done

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .

          if ! git diff --cached --quiet; then
            git commit -m "Move LeetCode solution [skip ci]"
            git push
          fi
