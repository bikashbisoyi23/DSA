name: Move LeetCode Solutions

# Give the workflow explicit write permission so the default GITHUB_TOKEN can push
permissions:
  contents: write

on:
  push:
    branches:
      - main
      - master

jobs:
  move:
    runs-on: ubuntu-latest

    # Avoid running when the workflow itself pushed the commit
    if: github.actor != 'github-actions[bot]'

    steps:
      - uses: actions/checkout@v4
        with:
          # ensure the GITHUB_TOKEN is persisted so git push uses it
          persist-credentials: true

      - name: Move folders
        run: |
          mkdir -p LeetCode

          for item in */ ; do
            folder="${item%/}"

            if [[ "$folder" != ".github" && "$folder" != "LeetCode" ]]; then
              mv "$folder" LeetCode/ || true
            fi
          done

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .
          # include [skip ci] to avoid retriggering this workflow
          git diff --cached --quiet || git commit -m "Move LeetCode solution [skip ci]"

          git push
