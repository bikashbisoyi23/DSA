name: Move LeetCode Solutions

permissions:
  contents: write

on:
  push:
    branches:
      - main
      - master

jobs:
  move:
    runs-on: ubuntu-latest

    # Don't run when the workflow itself pushes a commit
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Move only LeetCode problem folders
        shell: bash
        run: |
          mkdir -p LeetCode

          moved=false

          for item in */ ; do
            folder="${item%/}"

            # Skip these folders
            if [[ "$folder" == ".github" || \
                  "$folder" == ".vscode" || \
                  "$folder" == "LeetCode" ]]; then
              continue
            fi

            # Move only folders whose names start with a number
            # Examples:
            # 1-two-sum
            # 20-valid-parentheses
            # 347-top-k-frequent-elements
            # 0001-Two-Sum
            if [[ "$folder" =~ ^[0-9]+ ]]; then
              mv "$folder" "LeetCode/"
              moved=true
            fi
          done

          echo "MOVED=$moved" >> $GITHUB_ENV

      - name: Commit and Push
        if: env.MOVED == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add LeetCode

          if ! git diff --cached --quiet; then
            git commit -m "Move LeetCode solutions [skip ci]"
            git push
          fi
